name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/AssetManager

            git checkout -- pnpm-lock.yaml
            git pull origin master

            corepack enable pnpm
            pnpm install

            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            pnpm --filter @workspace/db run push

            pnpm run typecheck:libs
            pnpm --filter @workspace/api-server run build
            pnpm --filter @workspace/portal run build

            pm2 delete assetmanager || true
            DATABASE_URL="${{ secrets.DATABASE_URL }}" PORT=80 pm2 start "node artifacts/api-server/dist/index.js" --name assetmanager
            pm2 save

            pm2 status

      - name: Deployment Successful
        if: success()
        run: echo "✅ Deployment successful!"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Deployment failed - check Actions logs."
